<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปรียบเทียบราคาเรียกรถ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Thai', sans-serif; }
        body { background: #f8f9fa; padding: 15px; max-width: 750px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 15px; color: #333; font-size: 22px; }
        .map-container { height: 380px; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.15); margin-bottom: 15px; }
        #map { width: 100%; height: 100%; }
        .input-group { background: #fff; padding: 12px 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; font-size: 14px; }
        .input-row { display: flex; gap: 8px; align-items: center; }
        input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        .loc-btn { padding: 10px 12px; background: #e9ecef; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .calc-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #4CAF50, #45a049); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 5px; }
        .calc-btn:disabled { background: #ccc; cursor: not-allowed; }
        .toll-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 15px; margin: 15px 0; display: none; }
        .toll-option { display: flex; gap: 10px; margin-top: 12px; }
        .toll-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .btn-yes { background: #28a745; color: #fff; }
        .btn-no { background: #dc3545; color: #fff; }
        .result-card { background: #fff; border-radius: 12px; padding: 15px; margin-top: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; }
        .price-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #eee; }
        .price-row:last-child { border-bottom: none; }
        .price-label { font-weight: 500; }
        .price-value { font-weight: 700; }
        .error-box { background: #ffebee; border: 1px solid #ef5350; border-radius: 8px; padding: 12px; margin: 12px 0; color: #c62828; display: none; }
        .coords-note { font-size: 12px; color: #666; margin-top: 4px; min-height: 20px; }
        .loading { text-align: center; padding: 10px; color: #4CAF50; display: none; }
        .pick-hint { font-size: 13px; color: #4CAF50; margin-top: 5px; display: none; }
        .toll-type-note { font-size: 12px; color: #666; margin-top: 6px; }
    </style>
</head>
<body>

<h1>🚗 เปรียบเทียบราคาเรียกรถ</h1>
<div class="map-container"><div id="map"></div></div>
<div class="loading" id="loading">⏳ กำลังคำนวณเส้นทาง...</div>
<div class="pick-hint" id="pickHint">👆 กรุณาคลิกที่แผนที่เพื่อเลือกจุด</div>
<div class="error-box" id="errorBox"></div>

<div class="input-group">
    <label>🟢 จุดรับ</label>
    <div class="input-row">
        <input type="text" id="origin" placeholder="พิมพ์ที่อยู่ หรือกดปุ่มเลือกบนแผนที่">
        <button class="loc-btn" id="pickOriginBtn" onclick="startPickOrigin()" title="เลือกบนแผนที่">📍</button>
        <button class="loc-btn" onclick="useCurrentLocation('origin')" title="ใช้ตำแหน่งปัจจุบัน">📍</button>
    </div>
    <div class="coords-note" id="originCoords"></div>
</div>

<div class="input-group">
    <label>🔴 จุดส่ง</label>
    <div class="input-row">
        <input type="text" id="destination" placeholder="พิมพ์ที่อยู่ หรือกดปุ่มเลือกบนแผนที่">
        <button class="loc-btn" id="pickDestBtn" onclick="startPickDest()" title="เลือกบนแผนที่">📍</button>
        <button class="loc-btn" onclick="useCurrentLocation('destination')" title="ใช้ตำแหน่งปัจจุบัน">📍</button>
    </div>
    <div class="coords-note" id="destCoords"></div>
</div>

<button class="calc-btn" id="calcBtn" onclick="calculateRoute()">🔍 คำนวณเส้นทาง & ราคา</button>

<div class="toll-box" id="tollBox">
    <h3>⚠️ เส้นทางนี้มีค่าผ่านทาง</h3>
    <p id="tollDetails"></p>
    <div class="toll-type-note" id="tollTypeNote"></div>
    <div class="toll-option">
        <button class="toll-btn btn-yes" onclick="confirmToll(true)">✅ ใช่ ขึ้นทางด่วน/มอเตอร์เวย์</button>
        <button class="toll-btn btn-no" onclick="confirmToll(false)">❌ ไม่เอา ใช้ถนนธรรมดา</button>
    </div>
</div>

<div class="result-card" id="resultCard">
    <h3>📋 ผลการคำนวณ</h3>
    <div class="price-row"><span class="price-label">ระยะทาง</span><span class="price-value" id="distText">-</span></div>
    <div class="price-row"><span class="price-label">เวลาโดยประมาณ</span><span class="price-value" id="timeText">-</span></div>
    <div class="price-row" id="tollRow" style="display:none;"><span class="price-label">ค่าผ่านทางรวม</span><span class="price-value" id="tollCostText">-</span></div>
    <div class="price-row"><span class="price-label">Grab</span><span class="price-value" id="grabPrice">-</span></div>
    <div class="price-row"><span class="price-label">Bolt</span><span class="price-value" id="boltPrice">-</span></div>
    <div class="price-row"><span class="price-label">InDrive</span><span class="price-value" id="indrivePrice">-</span></div>
    <div class="price-row"><span class="price-label">แท็กซี่มิเตอร์</span><span class="price-value" id="taxiPrice">-</span></div>
</div>

<script>
const API_KEY = "AIzaSyAWxrmqcWiMppxhmHYWd1yNqMMi6BzfHMg";
let map;
let originMarker = null;
let destMarker = null;
let directionsRenderer = null;
let pickMode = null;
let originCoords = null;
let destCoords = null;
let currentRouteData = null;
let tollAmount = 0;
let tollType = ""; // 'expressway' = ทางด่วนกรุงเทพ, 'motorway' = มอเตอร์เวย์

function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'block' : 'none';
    document.getElementById('calcBtn').disabled = show;
}
function showError(msg) { 
    const b = document.getElementById('errorBox'); 
    b.innerHTML = msg; 
    b.style.display = 'block'; 
    console.error('Error:', msg);
}
function hideError() { document.getElementById('errorBox').style.display = 'none'; }
function showPickHint(show) {
    document.getElementById('pickHint').style.display = show ? 'block' : 'none';
}

function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 13.7563, lng: 100.5018 }, 
        zoom: 11, 
        streetViewControl: false
    });
    directionsRenderer = new google.maps.DirectionsRenderer({ map: map });
    
    map.addListener('click', function(e) { 
        if(!pickMode) return;
        placeMarker(e.latLng, pickMode); 
        pickMode = null;
        showPickHint(false);
    });
}

function startPickOrigin() {
    pickMode = 'origin';
    showPickHint(true);
}
function startPickDest() {
    pickMode = 'destination';
    showPickHint(true);
}

function placeMarker(latLng, type) {
    console.log('วางหมุด:', type, 'พิกัด:', latLng.lat(), latLng.lng());
    
    if(type === 'origin') {
        if(originMarker) originMarker.setMap(null);
        originMarker = new google.maps.Marker({ 
            position: latLng, 
            map: map, 
            title: 'จุดรับ',
            icon: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png' 
        });
        originCoords = { lat: latLng.lat(), lng: latLng.lng() };
        reverseGeocode(latLng, 'origin');
        document.getElementById('originCoords').textContent = 
            `พิกัด: ${originCoords.lat.toFixed(6)}, ${originCoords.lng.toFixed(6)}`;
    } else {
        if(destMarker) destMarker.setMap(null);
        destMarker = new google.maps.Marker({ 
            position: latLng, 
            map: map, 
            title: 'จุดส่ง',
            icon: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png' 
        });
        destCoords = { lat: latLng.lat(), lng: latLng.lng() };
        reverseGeocode(latLng, 'destination');
        document.getElementById('destCoords').textContent = 
            `พิกัด: ${destCoords.lat.toFixed(6)}, ${destCoords.lng.toFixed(6)}`;
    }
}

function useCurrentLocation(type) {
    if(!navigator.geolocation) {
        return alert('เบราว์เซอร์ไม่รองรับตำแหน่ง');
    }
    navigator.geolocation.getCurrentPosition(
        function(pos) { 
            const p = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude); 
            placeMarker(p, type); 
            map.panTo(p); 
            map.setZoom(15); 
        },
        function(err) {
            alert('หาตำแหน่งไม่ได้: ' + err.message);
        }
    );
}

function reverseGeocode(latLng, type) {
    const geocoder = new google.maps.Geocoder();
    geocoder.geocode(
        { location: latLng, language: 'th' }, 
        function(results, status) {
            if(status === 'OK' && results && results[0]) {
                document.getElementById(type).value = results[0].formatted_address;
            }
        }
    );
}

async function geocodeAddress(addr) {
    return new Promise(function(resolve, reject) {
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode(
            { address: addr + ', ประเทศไทย', language: 'th', region: 'th' },
            function(results, status) {
                if(status === 'OK' && results && results[0]) {
                    resolve(results[0].geometry.location);
                } else {
                    reject(`ไม่พบที่อยู่ (${status}) — ลองพิมพ์ชื่ออำเภอ/จังหวัดด้วย`);
                }
            }
        );
    });
}

// ✅ คำนวณค่าผ่านทางแยกประเภท
function calculateTollFee(sections, routeDistanceKm = 0) {
    // sections = จำนวนด่านที่ขึ้น-ลง
    // routeDistanceKm = ระยะทางโดยประมาณ ใช้ช่วยแยกประเภททาง
    
    // แยกประเภททางตามลักษณะระยะทาง + ตำแหน่ง
    // ทางด่วนในกรุงเทพ → ระยะสั้นๆ, มอเตอร์เวย์ → ระยะยาวกว่า
    const isMotorway = routeDistanceKm > 50 || 
        (originCoords && destCoords && 
         Math.abs(originCoords.lat - destCoords.lat) > 0.3);
    
    let baseFee, perGateFee;
    
    if(isMotorway) {
        // 🛣️ มอเตอร์เวย์ (กรุงเทพ-ชลบุรี, บางนา-ชลบุรี เป็นต้น)
        // เริ่มต้น 25 บาท + ตามช่วงทาง
        baseFee = 25;
        perGateFee = 30;
        tollType = "มอเตอร์เวย์";
    } else {
        // 🏙️ ทางด่วนในกรุงเทพฯ (เฉลิมมหานคร, ศรีรัช, บูรพาวิถี)
        // เริ่มต้น 50 บาท → สอดคล้องที่คุณบอก
        baseFee = 50;
        perGateFee = 25;
        tollType = "ทางด่วนกรุงเทพ";
    }
    
    // คำนวณรวม
    if(sections <= 1) {
        return { amount: baseFee, type: tollType };
    } else {
        return { amount: baseFee + (sections - 1) * perGateFee, type: tollType };
    }
}

async function calculateRoute() {
    hideError(); 
    directionsRenderer.setDirections({});
    showLoading(true);
    
    const oText = document.getElementById('origin').value.trim();
    const dText = document.getElementById('destination').value.trim();
    
    if(!oText || !dText) {
        showLoading(false);
        return showError('⚠️ กรุณาระบุจุดรับและจุดส่งให้ครบถ้วน');
    }

    try {
        // แปลงที่อยู่เป็นพิกัด
        if(!originCoords) {
            const oLatLng = await geocodeAddress(oText);
            placeMarker(oLatLng, 'origin');
        }
        if(!destCoords) {
            const dLatLng = await geocodeAddress(dText);
            placeMarker(dLatLng, 'destination');
        }

        if(!originCoords || !destCoords) {
            throw new Error('ไม่สามารถหาพิกัดได้ กรุณาลองคลิกเลือกบนแผนที่แทน');
        }

        // คำนวณเส้นทาง
        const dirResult = await new Promise(function(resolve, reject) {
            const service = new google.maps.DirectionsService();
            service.route({
                origin: new google.maps.LatLng(originCoords.lat, originCoords.lng),
                destination: new google.maps.LatLng(destCoords.lat, destCoords.lng),
                travelMode: 'DRIVE'
            }, function(res, status) {
                if(status === 'OK') resolve(res);
                else reject(`หาเส้นทางไม่ได้: ${status}`);
            });
        });

        directionsRenderer.setDirections(dirResult);
        const leg = dirResult.routes[0].legs[0];
        const distanceKm = (leg.distance.value / 1000).toFixed(1);
        const durationMin = Math.ceil(leg.duration.value / 60);
        
        currentRouteData = { distanceKm, durationMin };

        // เช็คค่าผ่านทาง
        tollAmount = 0;
        tollType = "";
        let tollSections = 0;
        
        try {
            const res = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Goog-Api-Key": API_KEY,
                    "X-Goog-FieldMask": "routes.duration,routes.distanceMeters,routes.travelAdvisory.tollInfo"
                },
                body: JSON.stringify({
                    origin: { location: { latLng: { latitude: originCoords.lat, longitude: originCoords.lng } } },
                    destination: { location: { latLng: { latitude: destCoords.lat, longitude: destCoords.lng } } },
                    travelMode: "DRIVE",
                    extraComputations: ["TOLLS"],
                    languageCode: "th-TH",
                    regionCode: "TH",
                    routeModifiers: { vehicleInfo: { type: "CAR" }, tollPasses: ["NOTOLLPASS"] }
                })
            });

            const data = await res.json();
            if(res.ok && data.routes && data.routes.length > 0) {
                const route = data.routes[0];
                if(route.travelAdvisory?.tollInfo?.tollSections?.length > 0) {
                    tollSections = route.travelAdvisory.tollInfo.tollSections.length;
                    const tollInfo = calculateTollFee(tollSections, parseFloat(distanceKm));
                    tollAmount = tollInfo.amount;
                    tollType = tollInfo.type;
                    
                    document.getElementById('tollDetails').innerHTML =
                        `จำนวนด่าน: <strong>${tollSections} ด่าน</strong><br>` +
                        `ค่าผ่านทางรวม: <strong>${tollAmount} บาท</strong>`;
                    document.getElementById('tollTypeNote').textContent = 
                        `ประเภท: ${tollType} (รถ 4 ล้อ)`;
                    document.getElementById('tollBox').style.display = 'block';
                    showLoading(false);
                    return;
                }
            }
        } catch(e) {
            console.warn('เช็คค่าผ่านทางไม่ได้:', e.message);
        }

        // ไม่มีค่าผ่านทาง
        document.getElementById('tollBox').style.display = 'none';
        tollAmount = 0;
        displayResults();

    } catch(e) {
        showLoading(false);
        showError('❌ ' + e.message);
        return;
    }

    showLoading(false);
}

async function confirmToll(wantToll) {
    hideError();
    document.getElementById('tollBox').style.display = 'none';
    showLoading(true);
    
    if(!wantToll) {
        tollAmount = 0;
        // หาเส้นทางใหม่โดยไม่ผ่านทางด่วน
        new google.maps.DirectionsService().route({
            origin: new google.maps.LatLng(originCoords.lat, originCoords.lng),
            destination: new google.maps.LatLng(destCoords.lat, destCoords.lng),
            travelMode: 'DRIVE',
            avoidTolls: true
        }, function(res, status) {
            if(status === 'OK') {
                directionsRenderer.setDirections(res);
                const leg = res.routes[0].legs[0];
                currentRouteData.distanceKm = (leg.distance.value / 1000).toFixed(1);
                currentRouteData.durationMin = Math.ceil(leg.duration.value / 60);
            }
            showLoading(false);
            displayResults();
        });
    } else {
        showLoading(false);
        displayResults();
    }
}

function displayResults() {
    if(!currentRouteData) return;
    
    const { distanceKm, durationMin } = currentRouteData;
    document.getElementById('distText').textContent = `${distanceKm} กม.`;
    document.getElementById('timeText').textContent = `${durationMin} นาที`;
    
    if(tollAmount > 0) {
        document.getElementById('tollRow').style.display = 'flex';
        document.getElementById('tollCostText').textContent = `${tollAmount} บาท`;
    } else {
        document.getElementById('tollRow').style.display = 'none';
    }

    const basePrice = 35 + parseFloat(distanceKm) * 6 + tollAmount;
    document.getElementById('grabPrice').textContent = `~${Math.round(basePrice * 1.15)} บาท`;
    document.getElementById('boltPrice').textContent = `~${Math.round(basePrice * 1.05)} บาท`;
    document.getElementById('indrivePrice').textContent = `~${Math.round(basePrice * 0.95)} บาท`;
    document.getElementById('taxiPrice').textContent = `~${Math.round(basePrice)} บาท`;
    
    document.getElementById('resultCard').style.display = 'block';
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAWxrmqcWiMppxhmHYWd1yNqMMi6BzfHMg&libraries=geocoding&callback=initMap&language=th&region=TH" async defer></script>

</body>
</html>
