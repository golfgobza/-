<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปรียบเทียบราคาเรียกรถ — Ride & Fuel Compare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        :root {
            --grab: #00b14f;
            --bolt: #000000;
            --indrive: #ff6b00;
            --taxi: #e74c3c;
        }
        body {
            background-color: #f8f9fa;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .input-group {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.95;
        }
        .toll-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 18px;
            margin: 20px 0;
            display: none;
        }
        .toll-option {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .toll-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-yes {
            background: #28a745;
            color: white;
        }
        .btn-no {
            background: #dc3545;
            color: white;
        }
        .result-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .price-row:last-child {
            border-bottom: none;
        }
        .price-label {
            font-weight: 500;
        }
        .price-value {
            font-weight: 700;
        }
    </style>
</head>
<body>

<h1>🚗 เปรียบเทียบราคาเรียกรถ</h1>

<div class="input-group">
    <label for="origin">📍 จุดรับ</label>
    <input type="text" id="origin" placeholder="กรอกที่อยู่จุดรับ...">
</div>

<div class="input-group">
    <label for="destination">📍 จุดส่ง</label>
    <input type="text" id="destination" placeholder="กรอกที่อยู่จุดส่ง...">
</div>

<button onclick="calculateRoute()">🔍 คำนวณเส้นทาง & ราคา</button>

<!-- กล่องแจ้งค่าผ่านทาง -->
<div class="toll-box" id="tollBox">
    <h3>⚠️ เส้นทางนี้มีค่าผ่านทาง</h3>
    <p id="tollDetails"></p>
    <div class="toll-option">
        <button class="toll-btn btn-yes" onclick="confirmToll(true)">✅ ใช่ ขึ้นทางด่วน เพิ่มค่าผ่านทาง</button>
        <button class="toll-btn btn-no" onclick="confirmToll(false)">❌ ไม่เอา ใช้ถนนธรรมดา</button>
    </div>
</div>

<!-- ผลลัพธ์ -->
<div class="result-card" id="resultCard">
    <h3>📋 ผลการคำนวณ</h3>
    <div class="price-row">
        <span class="price-label">ระยะทาง</span>
        <span class="price-value" id="distText">-</span>
    </div>
    <div class="price-row">
        <span class="price-label">เวลาโดยประมาณ</span>
        <span class="price-value" id="timeText">-</span>
    </div>
    <div class="price-row" id="tollRow" style="display:none;">
        <span class="price-label">ค่าผ่านทาง</span>
        <span class="price-value" id="tollCostText">-</span>
    </div>
    <div class="price-row">
        <span class="price-label">ค่าโดยสาร Grab</span>
        <span class="price-value" id="grabPrice">-</span>
    </div>
    <div class="price-row">
        <span class="price-label">ค่าโดยสาร Bolt</span>
        <span class="price-value" id="boltPrice">-</span>
    </div>
    <div class="price-row">
        <span class="price-label">ค่าโดยสาร InDrive</span>
        <span class="price-value" id="indrivePrice">-</span>
    </div>
    <div class="price-row">
        <span class="price-label">ค่าแท็กซี่มิเตอร์</span>
        <span class="price-value" id="taxiPrice">-</span>
    </div>
</div>

<script>
// 🔑 ใส่ API Key ตรงนี้ (ใส่ให้แล้วเรียบร้อย)
const API_KEY = "AIzaSyAWxrmqcWiMppxhmHYWd1yNqMMi6BzfHMg";

// ตัวแปรเก็บข้อมูลเส้นทาง
let currentRouteData = null;
let tollAmount = 0;

// 1. คำนวณเส้นทาง
async function calculateRoute() {
    const origin = document.getElementById('origin').value.trim();
    const destination = document.getElementById('destination').value.trim();
    
    if (!origin || !destination) {
        alert('กรุณากรอกจุดรับและจุดส่งให้ครบถ้วน');
        return;
    }

    // เรียก Google Routes API
    const url = "https://routes.googleapis.com/directions/v2:computeRoutes";
    
    const response = await fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-Goog-Api-Key": API_KEY,
            "X-Goog-FieldMask": "routes.duration,routes.distanceMeters,routes.travelAdvisory.tollInfo"
        },
        body: JSON.stringify({
            origin: { address: origin },
            destination: { address: destination },
            travelMode: "DRIVE",
            extraComputations: ["TOLLS"],
            routeModifiers: {
                vehicleInfo: { type: "CAR" },
                tollPasses: ["NOTOLLPASS"]
            }
        })
    });

    const data = await response.json();
    
    if (!data.routes || data.routes.length === 0) {
        alert("ไม่พบเส้นทาง กรุณาตรวจสอบที่อยู่อีกครั้ง");
        return;
    }

    const route = data.routes[0];
    const distanceKm = (route.distanceMeters / 1000).toFixed(1);
    const durationMin = Math.ceil(parseInt(route.duration.replace("s", "")) / 60);
    
    // เก็บข้อมูลไว้ใช้ต่อ
    currentRouteData = { distanceKm, durationMin, route };

    // ตรวจสอบว่ามีค่าผ่านทางไหม
    if (route.travelAdvisory?.tollInfo && route.travelAdvisory.tollInfo.tollSections?.length > 0) {
        const tollSections = route.travelAdvisory.tollInfo.tollSections.length;
        tollAmount = estimateTollCost(tollSections);
        
        // แสดงกล่องถามลูกค้า
        document.getElementById('tollDetails').innerHTML = 
            `จำนวนด่าน: <strong>${tollSections} ด่าน</strong><br>` +
            `ค่าผ่านทางโดยประมาณ: <strong>${tollAmount} บาท</strong> (รถ 4 ล้อ)`;
        
        document.getElementById('tollBox').style.display = "block";
        document.getElementById('resultCard').style.display = "none";
    } else {
        // ไม่มีค่าผ่านทาง แสดงผลทันที
        tollAmount = 0;
        displayResults();
    }
}

// 2. ประเมินค่าผ่านทาง (อ้างอิงอัตราค่าทางด่วนไทย)
function estimateTollCost(sections) {
    // อัตราค่าประมาณ: ทางด่วนกรุงเทพฯ และปริมณฑล
    const baseRate = 35;  // ค่าเริ่มต้น
    const perGate = 22;   // เฉลี่ยต่อด่าน
    return baseRate + ((sections - 1) * perGate);
}

// 3. ลูกค้าเลือกใช้/ไม่ใช้ทางด่วน
async function confirmToll(wantToll) {
    document.getElementById('tollBox').style.display = "none";
    
    if (!wantToll) {
        // เรียกเส้นทางใหม่โดยหลีกเลี่ยงค่าผ่านทาง
        const origin = document.getElementById('origin').value.trim();
        const destination = document.getElementById('destination').value.trim();
        
        const url = "https://routes.googleapis.com/directions/v2:computeRoutes";
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Goog-Api-Key": API_KEY,
                "X-Goog-FieldMask": "routes.duration,routes.distanceMeters"
            },
            body: JSON.stringify({
                origin: { address: origin },
                destination: { address: destination },
                travelMode: "DRIVE",
                routeModifiers: { avoidTolls: true }
            })
        });

        const data = await response.json();
        const route = data.routes[0];
        currentRouteData.distanceKm = (route.distanceMeters / 1000).toFixed(1);
        currentRouteData.durationMin = Math.ceil(parseInt(route.duration.replace("s", "")) / 60);
        tollAmount = 0;
    }
    
    displayResults();
}

// 4. คำนวณและแสดงราคา
function displayResults() {
    const { distanceKm, durationMin } = currentRouteData;
    
    // แสดงระยะทางและเวลา
    document.getElementById('distText').textContent = `${distanceKm} กม.`;
    document.getElementById('timeText').textContent = `${durationMin} นาที`;
    
    // แสดงค่าผ่านทางถ้ามี
    if (tollAmount > 0) {
        document.getElementById('tollRow').style.display = "flex";
        document.getElementById('tollCostText').textContent = `${tollAmount} บาท`;
    } else {
        document.getElementById('tollRow').style.display = "none";
    }

    // สูตรคำนวณราคา (ปรับตามจริงได้)
    const baseFare = 35;
    const perKmRate = 6;
    const distanceNum = parseFloat(distanceKm);
    
    const basePrice = baseFare + (distanceNum * perKmRate);
    const finalPrice = basePrice + tollAmount;
    
    // แสดงราคาค่าบริการต่างๆ
    document.getElementById('grabPrice').textContent = `~${Math.round(finalPrice * 1.15)} บาท`;
    document.getElementById('boltPrice').textContent = `~${Math.round(finalPrice * 1.05)} บาท`;
    document.getElementById('indrivePrice').textContent = `~${Math.round(finalPrice * 0.95)} บาท`;
    document.getElementById('taxiPrice').textContent = `~${Math.round(finalPrice)} บาท`;
    
    document.getElementById('resultCard').style.display = "block";
}
</script>

</body>
</html>
